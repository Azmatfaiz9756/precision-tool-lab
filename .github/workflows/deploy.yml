name: 🚀 Deploy to Hostinger VPS

on:
  push:
    branches:
      - main   # main branch pe push hone par automatically deploy hoga

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # ── 1. Code checkout ────────────────────────────────────────────────────
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js setup ────────────────────────────────────────────────────
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Install dependencies ─────────────────────────────────────────────
      - name: 📦 Install dependencies
        run: npm ci

      # ── 4. Build React app ──────────────────────────────────────────────────
      - name: 🏗️ Build production app
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY:             ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN:         ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID:          ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET:      ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID:              ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_API_BASE_URL:                 ${{ secrets.VITE_API_BASE_URL }}

      # ── 5. Deploy React dist/ to VPS public_html ────────────────────────────
      - name: 📤 Deploy frontend (dist/) to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     ${{ secrets.VPS_PORT }}
          source:   "dist/*"
          target:   ${{ secrets.VPS_FRONTEND_PATH }}
          strip_components: 1   # removes the "dist/" prefix

      # ── 6. Deploy PHP backend to VPS ────────────────────────────────────────
      - name: 📤 Deploy backend (PHP) to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     ${{ secrets.VPS_PORT }}
          source:   "backend/*"
          target:   ${{ secrets.VPS_BACKEND_PATH }}
          strip_components: 1

      # ── 7. Post-deploy commands on VPS ──────────────────────────────────────
      - name: 🔧 Run post-deploy commands on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     ${{ secrets.VPS_PORT }}
          script: |
            echo "✅ Deployment complete at $(date)"
            # Add any post-deploy commands here e.g.:
            # php ${{ secrets.VPS_BACKEND_PATH }}/artisan migrate --force
